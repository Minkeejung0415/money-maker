[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alpha-terminal"
version = "0.1.0"
description = "Unified multi-asset trading engine: stocks, crypto, sports"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Alpha Terminal" }]
license = { text = "MIT" }
dependencies = [
    "polars>=0.20",
    "dask>=2024.1",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "boto3>=1.34",
    "httpx>=0.27",
    "ccxt>=4.3",
    "nba_api>=1.5",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.0,<3",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "MLB-StatsAPI>=1.7",
    "pybaseball>=2.2",
    "soccerdata",
    "plotly>=6.0",
    "PyPortfolioOpt>=1.5",
    "TA-Lib>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["alpha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
